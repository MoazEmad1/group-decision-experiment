server {
    listen 80;

    # Re-resolve "backend" via Docker's DNS instead of caching its IP at nginx startup,
    # so recreating only the backend (e.g. to switch CONFIG_PATH) doesn't cause 502s.
    # proxy_pass with a variable needs a resolver.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
